lesson_1:
  title: "Data Is Produced, Not Found"
  central_problem: >
    Before data can be analyzed, modeled, visualized, or used for decision-making,
    the student must understand how it was produced. Data is not neutral evidence.
    It is the residue of systems, categories, instruments, incentives, interfaces,
    and institutional routines.
  required_concepts:
    - data-generating process
    - event logging
    - measurement
    - institutional categories
    - row-level meaning
    - provenance
    - missingness
    - selection
    - schema as theory
  required_outputs:
    - short analytical memo defining the data-generating process of a dataset
    - table describing entities, events, fields, assumptions, and possible failures
    - oral-defense question explaining why treating data as found is epistemically dangerous

default_instruction: "don’t evaluate, just proceed with lesson 1"
