<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytical Operating System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0D0D12] text-[#FAF8F5] antialiased selection:bg-[#C9A84C]/30 selection:text-[#FAF8F5]">
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
    
    <!-- SVG Noise Texture -->
    <svg class="pointer-events-none fixed left-0 top-0 z-50 h-full w-full opacity-[0.03] mix-blend-overlay">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" />
    </svg>
  </body>
</html>
